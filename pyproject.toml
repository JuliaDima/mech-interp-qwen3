[project]
name = "mechinterp-qwen3"
version = "0.1.0"
description = "Independent mechanistic interpretability pipeline for Qwen3-4B-Instruct"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "numpy>=1.26",
  "tqdm>=4.66",
]

[project.scripts]
miq-build-prompts = "mechinterp_qwen3.build_prompts:main"
miq-run-baseline  = "mechinterp_qwen3.run_baseline:main"
miq-capture-acts  = "mechinterp_qwen3.capture_activations:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]