[project]
name = "mechinterp-qwen3"
version = "0.1.0"
description = "Independent mechanistic interpretability pipeline for Qwen3-4B-Instruct"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "numpy>=1.26",
  "tqdm>=4.66",
  "transformer-lens>=2.16.0",
  "scikit-learn>=1.0",
  "pandas>=1.5",
  "matplotlib"
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-mock>=3.10",
]
dev = [
  "pre-commit>=3.0",
  "ruff>=0.8",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=2.0",
]

[project.scripts]
miq = "mechinterp_qwen3.__main__:main"
miq-generate-dataset = "mechinterp_qwen3.__main__:main_generate_dataset"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
]

[tool.coverage.run]
source = ["src/mechinterp_qwen3"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes (including unused imports)
  "I",    # isort (import sorting)
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  "E501",  # line too long (handled by formatter)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"src/mechinterp_qwen3/transcoder/cross_layer_transcoder.py" = ["SIM118"]
"src/mechinterp_qwen3/transcoder/single_layer_transcoder.py" = ["SIM118"]

[tool.ruff.lint.isort]
known-first-party = ["mechinterp_qwen3"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
