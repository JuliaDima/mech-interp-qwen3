workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

stages:
  - test
  - lint

unit-test-job:
  stage: test
  before_script:
    - python -V
    - python -m pip install -U pip
    - python -m pip install -e ".[test]"
  script:
    - python -m pytest tests/ -v --cov=src/mechinterp_qwen3 --cov-report=term --cov-report=html --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days

lint-test-job:
  stage: lint
  before_script:
    - python -V
    - python -m pip install -U pip
    - python -m pip install ruff
  script:
    - ruff check src/ tests/ --output-format=gitlab
  allow_failure: true