stages:
  - test
  - pages

variables:
  CONDA_ROOT: "$HOME/miniforge3"
  CONDA_ENV: "p28_py311_env"

.conda_setup: &conda_setup
  - unset LD_PRELOAD || true
  - export PATH="${CONDA_ROOT}/envs/${CONDA_ENV}/bin:${PATH}"
  - export LD_LIBRARY_PATH="${CONDA_ROOT}/envs/${CONDA_ENV}/lib/python3.11/site-packages/nvidia/nccl/lib:${LD_LIBRARY_PATH:-}"
  - python --version

unit-test-job:
  stage: test
  before_script:
    - *conda_setup
    - pip install -e ".[test]"
  script:
    - python -m pytest tests/ -v --cov=src/mechinterp_qwen3 --cov-report=term --cov-report=html --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    paths:
      - htmlcov/
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 30 days

lint-job:
  stage: test
  before_script:
    - *conda_setup
    - pip install ruff
  script:
    - echo "Running linting checks..."
    - ruff check src/ tests/ --output-format=gitlab
    - echo "Running format checks..."
    - ruff format src/ tests/ --check
  allow_failure: true

pages:
  stage: pages
  before_script:
    - *conda_setup
    - pip install -e ".[docs]" linkify-it-py
  script:
    - python -m sphinx -b html docs/ public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
